<main>
  <h2>Kontak</h2>
  <p class="sub">Ada pertanyaan atau tawaran? Tulis pesan di bawah.</p>
  <section>
    <form action="#" method="post">
      <label for="nama">Nama lengkap</label>
      <input type="text" id="nama" name="nama" placeholder="Masukkan nama" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="nama@email.com" required>
      <label for="topik">Topik</label>
      <select id="topik" name="topik"><option>Tawaran proyek</option><option>Magang</option><option>Pertanyaan umum</option></select>
      <label for="pesan">Pesan</label>
      <textarea id="pesan" name="pesan" rows="5" placeholder="Tulis pesan Anda" required></textarea>
      <button type="submit">Kirim</button>
      <button type="reset" style="background:transparent;color:var(--teks)">Hapus</button>
    </form>
